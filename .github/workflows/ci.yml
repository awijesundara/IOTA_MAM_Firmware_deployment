name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntax-check application sources
        run: |
          for file in app.js config.js bin/www lib/mamPublisher.js gateway-selftest/*.js routes/*.js; do
            [ ! -f "$file" ] || node --check "$file"
          done
